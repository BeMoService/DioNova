<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MiMipadel — Binnenkort online</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        font-family: "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, Roboto, Arial, sans-serif;
        background: #f4f1ea;
        color: #1c2420;
      }

      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        padding: 48px 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid #d8d2c6;
        box-shadow: 0 8px 28px rgba(28, 36, 32, 0.08);
      }

      .brand {
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #1f6b54;
        margin-bottom: 24px;
      }

      h1 {
        font-size: clamp(1.6rem, 4vw, 2rem);
        line-height: 1.25;
        margin-bottom: 16px;
      }

      p {
        line-height: 1.7;
        color: #5c6760;
        font-size: 1.02rem;
      }

      .line {
        width: 72px;
        height: 3px;
        margin: 24px auto;
        border-radius: 999px;
        background: linear-gradient(90deg, #1f6b54, #c17f59 70%, transparent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">MiMipadel</div>
      <h1>Binnenkort online</h1>
      <div class="line" aria-hidden="true"></div>
      <p>
        Onze website is momenteel in ontwikkeling. Binnenkort vind je hier alles over padelreizen naar Italië.
      </p>
    </main>
  </body>
</html>
