<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>mimi padel — Binnenkort online</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
        background: #fafaf8;
        color: #141414;
      }

      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        padding: 48px 32px;
        border-radius: 16px;
        background: #ffffff;
        border: 1px solid rgba(90, 99, 56, 0.22);
        box-shadow: 0 8px 28px rgba(20, 20, 20, 0.08);
      }

      .brand {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #5a6338;
        margin-bottom: 24px;
        text-transform: lowercase;
      }

      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.6rem, 4vw, 2rem);
        line-height: 1.25;
        margin-bottom: 16px;
      }

      p {
        line-height: 1.7;
        color: #5c5c54;
        font-size: 1.02rem;
      }

      .line {
        width: 72px;
        height: 3px;
        margin: 24px auto;
        border-radius: 999px;
        background: linear-gradient(90deg, #c9a227, #5a6338 70%, transparent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">mimi padel</div>
      <h1>Binnenkort online</h1>
      <div class="line" aria-hidden="true"></div>
      <p>
        Onze website is momenteel in ontwikkeling. Binnenkort vind je hier alles over padelreizen naar Italië.
      </p>
    </main>
  </body>
</html>
